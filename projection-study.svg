<text x="740" y="263" font-size="20">ХВОСТ — ВВЕРХ ВПРАВО</text>
<text x="70" y="610" font-size="20">КАБИНА — ВНИЗ ВЛЕВО</text>
<text x="60" y="166" font-size="16">Форпост стоит на песке, вне полотна</text>
<text x="40" y="697" font-size="19">1. Видны крыши и две боковые плоскости. Вертикали не наклоняем.</text>
<text x="40" y="730" font-size="19">2. Дорога, фура, сцепка и прицеп используют одни оси: 2 по горизонтали / 1 по вертикали.</text>
<text x="40" y="763" font-size="19">3. Утверждаем только ракурс. Детали, цвета и размеры техники ещё не финальные.</text>
